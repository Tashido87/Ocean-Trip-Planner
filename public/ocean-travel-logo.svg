<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 220" width="100%" height="100%">
  <defs>
    <style>
      .brand-red { fill: #a80c10; }
      .brand-dark { fill: #2d3139; }
      .brand-gray { fill: #555b66; }
      .brand-line { stroke: #c24146; stroke-width: 1.2; stroke-linecap: round; }
    </style>
  </defs>

  <g transform="translate(15, 10)">
    <!-- O (Red) -->
    <path class="brand-red" d="M 38,72 C 22,72 12,62 12,46 L 12,38 C 12,22 22,12 38,12 L 68,12 C 84,12 94,22 94,38 L 94,46 C 94,62 84,72 68,72 Z M 39,59 L 67,59 C 75,59 80,54 80,45 L 80,39 C 80,30 75,25 67,25 L 39,25 C 31,25 26,30 26,39 L 26,45 C 26,54 31,59 39,59 Z" />

    <!-- C (Red) -->
    <path class="brand-red" d="M 178,25 C 172,17 163,12 150,12 L 128,12 C 112,12 102,22 102,38 L 102,46 C 102,62 112,72 128,72 L 150,72 C 163,72 172,67 178,59 L 180,59 C 180,59 169,49 166,49 C 162,54 157,59 149,59 L 129,59 C 121,59 116,54 116,45 L 116,39 C 116,30 121,25 129,25 L 149,25 C 157,25 162,30 166,35 C 169,35 180,25 180,25 Z" />

    <!-- E (Top Red, Mid & Bottom Dark) -->
    <!-- Top Bar (Red) -->
    <path class="brand-red" d="M 194,12 L 254,12 C 257,12 260,15 260,18.5 C 260,22 257,25 254,25 L 194,25 C 190.5,25 188,22 188,18.5 C 188,15 190.5,12 194,12 Z" />
    <!-- Middle Bar (Dark) -->
    <path class="brand-dark" d="M 194,35.5 L 246,35.5 C 249,35.5 252,38.5 252,42 C 252,45.5 249,48.5 246,48.5 L 194,48.5 C 190.5,48.5 188,45.5 188,42 C 188,38.5 190.5,35.5 194,35.5 Z" />
    <!-- Bottom Bar (Dark) -->
    <path class="brand-dark" d="M 194,59 L 254,59 C 257,59 260,62 260,65.5 C 260,69 257,72 254,72 L 194,72 C 190.5,72 188,69 188,65.5 C 188,62 190.5,59 194,59 Z" />

    <!-- A (Dark Chevron + Red Inner Triangle) -->
    <path class="brand-dark" d="M 299,12 L 314,12 L 348,72 L 332,72 L 322,54 L 291,54 L 281,72 L 265,72 Z M 297,42 L 316,42 L 306.5,23.5 Z" />
    <!-- Red Inner Solid Triangle in A -->
    <polygon class="brand-red" points="306.5,45 295,65 318,65" />

    <!-- N (Dark) -->
    <path class="brand-dark" d="M 353,12 L 368,12 L 401,57 L 401,12 L 415,12 L 415,72 L 400,72 L 367,27 L 367,72 L 353,72 Z" />
  </g>

  <!-- TRAVEL (Crimson Red with wide tracking) -->
  <text x="260" y="142" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Montserrat', sans-serif" font-weight="700" font-size="34" letter-spacing="18" fill="#a80c10">TRAVEL</text>

  <!-- Footer Line & Subtitle -->
  <!-- Left subtle line -->
  <line x1="50" y1="175" x2="105" y2="175" class="brand-line" />
  <!-- Subtitle text -->
  <text x="260" y="179" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12.5" letter-spacing="4.5" fill="#555b66">EXPLORE. DISCOVER. EXPERIENCE.</text>
  <!-- Right subtle line -->
  <line x1="415" y1="175" x2="470" y2="175" class="brand-line" />
</svg>
